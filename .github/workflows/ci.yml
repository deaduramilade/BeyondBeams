name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      - name: Generate CycloneDX dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Retain SBOM as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Parse JSON
        run: npm run validate:json
      - name: Scan tracked files for credential material
        run: npm run scan:secrets
      - name: Check patch whitespace
        run: git diff --check HEAD